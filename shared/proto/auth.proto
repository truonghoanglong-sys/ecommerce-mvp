syntax = "proto3";

package auth;

// Identity & Access Bounded Context – API Gateway gọi (sơ đồ kiến trúc: Gateway ↔ Auth = gRPC)
service AuthService {
  rpc Register (RegisterRequest) returns (RegisterReply);   // POST /api/auth/register
  rpc Login (LoginRequest) returns (LoginReply);            // POST /api/auth/login
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string fullname = 4;
  string phone = 5;
}

message RegisterReply {
  string message = 1;
  int32 uid = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}
